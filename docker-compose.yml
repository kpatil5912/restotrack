services:
  db:
    image: postgres:16
    container_name: restotrack-db
    environment:
      POSTGRES_DB: ${DB_NAME:-restotrack}
      POSTGRES_USER: ${DB_USER:-restotrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - restotrack-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-restotrack} -d ${DB_NAME:-restotrack}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  restotrack-db-data:
